apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-used-keys-cleaner
spec:
  schedule: "*/15 * * * *"  # каждые 15 минут
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            image: redis-cleaner:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_URL
            - name: USED_KEYS_SET
              value: "used_keys"
            - name: EXPIRE_MINUTES
              value: "15"
          restartPolicy: OnFailure